description: "Evaluación determinística de Parachute S.A."

prompts:
  - "{{question}}"

providers:
  - id: file://provider_combined.py
    config:
      workers: 1
      timeout: 60000

evaluateOptions:
  maxConcurrency: 1
  timeoutMs: 65000

  # FAQ puede tardar considerablemente porque ejecuta el agente real.
  maxEvalTimeMs: 480000

  cache: false

defaultTest:
  merge: true
  assert:
    - type: latency
      threshold: 60000

# Ejecuta:
#
# - 6 casos FAQ con provider.py
# - 15 casos P3 con provider_p3.py
#
# Cada caso agrega sus assertions determinísticas y de tool execution.
tests: file://cases/*.yaml
