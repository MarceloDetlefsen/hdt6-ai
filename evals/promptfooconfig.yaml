description: "Evaluación de Promptfoo para Parachute S.A."

prompts:
  - "{{question}}"

providers:
  - id: file://provider.py
    config:
      workers: 1
      timeout: 60000

evaluateOptions:
  # El provider modifica estado temporal durante cada caso y Groq tiene
  # límites de uso, por lo que ejecutamos un caso a la vez.
  maxConcurrency: 1

  # Timeout por caso.
  timeoutMs: 65000

  # Límite máximo de la evaluación completa.
  maxEvalTimeMs: 480000

  # Se desactiva para que la medición de latencia sea real.
  cache: false

defaultTest:
  merge: true

  assert:
    # 1. LATENCIA
    - type: latency
      threshold: 60000

    # 2. FACTUALITY
    # Compara la respuesta producida por el agente contra la referencia
    # definida en cada caso.
    #
    # Se especifica Groq explícitamente para evitar que Promptfoo intente
    # seleccionar automáticamente un grader incompatible.
    - type: factuality
      value: "{{reference}}"
      provider: groq:openai/gpt-oss-20b
      metric: Factuality

# Los archivos dentro de cases/ agregan:
#
# 3. EVALS DETERMINÍSTICOS
#    - icontains para FAQ
#    - regex para citas
#
# 4. TOOL EXECUTION
#    - assertions.js verifica metadata.tool_calls
#    - también comprueba citas creadas/no creadas
tests: file://cases/*.yaml
