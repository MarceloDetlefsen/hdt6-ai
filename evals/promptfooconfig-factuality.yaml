description: "Evaluación de factuality para Parachute S.A."

prompts:
  - "{{question}}"

providers:
  - id: file://provider.py
    config:
      workers: 1
      timeout: 60000

evaluateOptions:
  # Factuality utiliza un grader LLM adicional, por lo que
  # mantenemos la ejecución secuencial para reducir rate limits.
  maxConcurrency: 1

  timeoutMs: 65000

  # Dos casos representativos no deberían necesitar el límite
  # completo de la suite end-to-end.
  maxEvalTimeMs: 180000

  cache: false

defaultTest:
  merge: true
  assert:
    # Grader nativo de factuality de Promptfoo.
    # Compara la salida del agente contra la referencia factual.
    - type: factuality
      value: "{{reference}}"
      provider: groq:openai/gpt-oss-20b
      metric: Factuality

tests:

  # ---------------------------------------------------------
  # FACTUALITY - FAQ
  # ---------------------------------------------------------

  - vars:
      question: "¿Cuál es la edad mínima permitida para saltar?"
      reference: "La edad mínima permitida para saltar es de 18 años"
      required_tools:
        - name: "consultar_faq"
          origin: "agent:SupervisorCentral"
        - name: "search_knowledge_base"
          origin: "agent:FAQWorker"
          error: false
      expected_created_appointments: 0

  # ---------------------------------------------------------
  # FACTUALITY - CITAS
  # ---------------------------------------------------------

  - vars:
      question: "Quiero calendarizar una cita el 2026-10-01"
      reference: "La cita se calendariza tentativamente porque la fecha es válida y el clima es IDEAL; queda pendiente de confirmación del instructor."
      fixed_today: "2026-09-30"
      weather_fixture: '{"temperature_c":25,"precipitation_mm":0,"cloud_cover_pct":10,"visibility_m":10000,"wind_speed_kmh":10,"wind_gust_kmh":20}'
      required_tools: '[{"name":"weather_tool","origin":"agent:WeatherWorker","error":false},{"name":"schedule_tool","origin":"agent:CalendarWorker","error":false}]'
      expected_created_appointments: 1
